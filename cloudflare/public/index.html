:root{
  --ink:#08090C; --ink2:#0C0D13; --panel:#14151C;
  --line:rgba(245,197,61,.16); --line-soft:rgba(255,255,255,.08);
  --gold:#F5C53D; --gold-2:#FFD45E; --gold-deep:#D99A12; --gold-hi:#FFE9A8;
  --ivory:#F6F5F2; --zinc:#A0A0AC; --zinc-dim:#6A6A76;
  --zap:#25D366; --zap-deep:#16A152;
  --disp:'Sora',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif; --mono:'Sora',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--ink);color:var(--ivory);font-family:var(--body);line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
a{color:inherit;text-decoration:none}
header{width:100%;background:rgba(8,9,12,.82);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);padding:0 clamp(16px,4vw,32px);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;height:74px;
  position:sticky;top:0;z-index:900}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:800;
  font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.brand .b{color:var(--gold)}
.brand img{width:38px;height:38px;border-radius:10px}
nav{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:700;flex-wrap:wrap}
nav a{font-family:var(--disp);display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  padding:.5rem 1.1rem;border-radius:11px;border:1px solid var(--line);color:var(--ivory);
  transition:.22s;white-space:nowrap}
nav a:hover{border-color:var(--gold);background:rgba(245,197,61,.08);transform:translateY(-1px)}
nav a.destaque{background:linear-gradient(155deg,var(--gold-hi),var(--gold) 52%,var(--gold-deep));

<script>
'use strict';
// ------------------------------------------------ dados (localStorage)
// modo pela URL: / = empresa, /meu = colaborador, /admin = gestor
const MODO = location.pathname.startsWith('/admin') ? 'gestor'
  : location.pathname.startsWith('/meu') ? 'colaborador' : 'empresa';
const pad = n => String(n).padStart(2, '0');
const hojeStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const mesAtual = () => hojeStr().slice(0, 7);
const agoraHora = () => { const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db = { funcionarios: [], registros: [], justificativas: [], notificacoes: [] };
let token = null;
let gestorNome = 'Gestor';

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (token) opt.headers['authorization'] = 'Bearer ' + token;
  if (body) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  let data = null; try { data = await res.json(); } catch (e) {}
  return data || {};
}
function save() {}  // os dados ficam no servidor
function mergePessoas(pessoas, func) {
  const tem = pessoas.some(p => p.id === func.id);
  return pessoas.map(p => p.id === func.id ? func : p).concat(tem ? [] : [func]);
}
function aplicarColab(e) {
  db = { funcionarios: mergePessoas(e.pessoas || [], e.func),
    registros: e.registros || [], justificativas: e.justificativas || [], notificacoes: e.notificacoes || [] };
}
function aplicarAdmin(e) {
  db = { funcionarios: e.funcionarios || [], registros: e.registros || [],
    justificativas: e.justificativas || [], notificacoes: e.notificacoes || [] };
}
function recarregar() {
  if (st.adminOk) return api('GET', '/api/admin').then(aplicarAdmin);
  if (st.funcId) return api('GET', '/api/meu').then(aplicarColab);
  return api('GET', '/api/pessoas').then(r => { db.funcionarios = r.pessoas || []; });
}
function mut(path, body, okMsg) {
  api('POST', path, body).then(res => {
    if (res && res.erro) { flash(res.erro, 'erro'); render(); return; }
    if (okMsg) flash(okMsg, 'ok');
    recarregar().then(render);
  });
}

// ------------------------------------------------ regras (iguais ao app real)
const ROTULOS = { entrada:'Entrada', saida_almoco:'Saída almoço', volta_almoco:'Volta almoço',
  saida_cafe:'Saída café', volta_cafe:'Volta café', saida:'Saída' };
const ORDEM = Object.keys(ROTULOS);
const PROXIMOS = { '':['entrada'], entrada:['saida_almoco','saida'], saida_almoco:['volta_almoco'],
  volta_almoco:['saida_cafe','saida'], saida_cafe:['volta_cafe'], volta_cafe:['saida'], saida:[] };
const TIPOS_COM_ATRASO = ['entrada','volta_almoco','volta_cafe'];
const STATUS = { '':['sem-registro','Sem registro'], entrada:['trabalhando','Trabalhando'],
  volta_almoco:['trabalhando','Trabalhando'], volta_cafe:['trabalhando','Trabalhando'],
  saida_almoco:['pausa','Em almoço'], saida_cafe:['pausa','No café'], saida:['fora','Encerrado'] };

const _min = h => { const p = h.split(':'); return +p[0]*60 + +p[1]; };
const _seg = h => { const p = h.split(':'); return +p[0]*3600 + +p[1]*60 + (+p[2]||0); };
const fmtSeg = s => { s = Math.max(s,0); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60)); };
const fmtMin = m => m >= 60 ? Math.floor(m/60)+'h'+pad(m%60) : m+' min';
const fmtData = iso => iso.split('-').reverse().join('/');
const diaSemana = iso => new Date(iso + 'T00:00:00').getDay(); // 0=Dom ... 6=Sáb
const ehFuturo = iso => iso > hojeStr();
const justPorDia = (fid, dia) => db.justificativas.find(j => j.funcionario_id === fid && j.dia === dia);

// situação de um dia do calendário
function statusDoDia(f, dia) {
  const regs = regsDo(f.id, dia);
  if (regs.length) {
    const [seg] = trabalhadoDoDia(regs);
    return { classe:'trabalhado', rotulo:'Trabalhado', horas: fmtSeg(seg) };
  }
  const j = justPorDia(f.id, dia);
  if (j && j.status === 'aprovada') return { classe:'abonada', rotulo:'Falta abonada' };
  if (j && j.status === 'pendente') return { classe:'pendente', rotulo:'Em análise' };
  if (ehFuturo(dia)) return { classe:'futuro', rotulo:'' };
  const dow = diaSemana(dia);
  if (dow === 0 || dow === 6) return { classe:'fds', rotulo:'—' };
  return { classe:'falta', rotulo:'Falta' };  // dia útil sem registro
}

const funcPorId = id => db.funcionarios.find(f => f.id === id);
const regsDo = (fid, dia) => db.registros.filter(r => r.funcionario_id === fid && r.dia === dia)
  .sort((a,b) => a.horario < b.horario ? -1 : 1);

function trabalhadoDoDia(regs) {
  let total = 0, ini = null;
  for (const r of regs) {
    if (['entrada','volta_almoco','volta_cafe'].includes(r.tipo)) ini = r.horario;
    else if (ini !== null) { total += _seg(r.horario) - _seg(ini); ini = null; }
  }
  return [total, ini];
}
function atrasosDoDia(regs, f) {
  const por = {}; regs.forEach(r => por[r.tipo] = r);
  const out = [];
  if (por.entrada) {
    const m = _min(por.entrada.horario) - _min(f.hora_entrada);
    if (m > 0) out.push({ reg: por.entrada, evento:'Entrada',
      detalhe:`previsto ${f.hora_entrada}, bateu ${por.entrada.horario.slice(0,5)}`, minutos:m });
  }
  for (const [s, v, lim, nome] of [['saida_almoco','volta_almoco',f.almoco_min,'Almoço'],
                                   ['saida_cafe','volta_cafe',f.cafe_min,'Café da tarde']]) {
    if (por[s] && por[v]) {
      const dur = _min(por[v].horario) - _min(por[s].horario), m = dur - lim;
      if (m > 0) out.push({ reg: por[v], evento:nome,
        detalhe:`pausa de ${fmtMin(dur)} (permitido ${fmtMin(lim)})`, minutos:m });
    }
  }
  return out;
}
function resumoDoDia(f, dia) {
  const regs = regsDo(f.id, dia);
  const [seg, aberto] = trabalhadoDoDia(regs);
  const atrasos = atrasosDoDia(regs, f);
  return { regs, seg, aberto: aberto !== null, atrasos,
    trabalhado: fmtSeg(seg),
    perdido: atrasos.filter(a => !a.reg.abonado).reduce((s,a) => s+a.minutos, 0),
    abonado: atrasos.filter(a => a.reg.abonado).reduce((s,a) => s+a.minutos, 0) };
}
function montaEspelho(f, mes) {
  const dias = [...new Set(db.registros.filter(r => r.funcionario_id === f.id && r.dia.startsWith(mes))
    .map(r => r.dia))].sort();
  const linhas = dias.map(dia => ({ dia, ...resumoDoDia(f, dia) }));
  return { linhas, totais: {
    dias: dias.length,
    trabalhado: fmtSeg(linhas.reduce((s,l) => s+l.seg, 0)),
    perdido: linhas.reduce((s,l) => s+l.perdido, 0),
    abonado: linhas.reduce((s,l) => s+l.abonado, 0) } };
}

function render() {

    (st.tela === 'admin' || st.tela === 'adminEspelho') ? '1080px' : '';

  if (st.tela === 'bater') iniciaBater();

function iniciaBater() {
  const tick = () => { const el = document.getElementById('relogio');
    if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour12:false }); };
  tick(); relogioTimer = setInterval(tick, 1000);
  const video = document.getElementById('video'), aviso = document.getElementById('cam-aviso');
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:640 } })
      .then(stream => { camStream = stream; video.srcObject = stream; video.style.display = 'block';
        aviso.textContent = 'A foto será tirada no momento da batida.'; camOk = true; })
      .catch(() => { aviso.textContent = 'Câmera indisponível — a batida será registrada sem foto.'; });
  } else { aviso.textContent = 'Câmera indisponível — a batida será registrada sem foto.'; }
}

function baterAgora() {
  const tipo = st.baterTipo;
  let foto = null;
  if (camOk) {
    const video = document.getElementById('video'), canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0);
    try { foto = canvas.toDataURL('image/jpeg', 0.6); } catch {}
  }
  const chk = document.getElementById('avisado');
  const avisado = chk && chk.checked ? 1 : 0;
  const campoMotivo = document.getElementById('motivo');
  const motivo = avisado && campoMotivo ? campoMotivo.value.trim() : '';
  api('POST', '/api/bater', { tipo, foto, avisado, motivo }).then(res => {
    if (res.erro) { flash(res.erro, 'erro'); st.tela = 'painel'; render(); return; }
    recarregar().then(() => {
      const f = funcPorId(st.funcId);
      const atraso = atrasosDoDia(regsDo(f.id, hojeStr()), f).find(a => a.reg.tipo === tipo);
      if (atraso && atraso.reg.abonado) flash(`${atraso.evento}: excedeu ${fmtMin(atraso.minutos)} (${atraso.detalhe}) — marcado como avisado e autorizado.`, 'ok');
      else if (atraso) flash(`Atenção: ${atraso.evento.toLowerCase()} excedeu ${fmtMin(atraso.minutos)} (${atraso.detalhe}). Esse tempo será descontado.`, 'erro');
      else if (tipo !== 'saida') flash(`${ROTULOS[tipo]} registrada às ${(res.horario || '').slice(0,5)}.`, 'ok');
      st.tela = tipo === 'saida' ? 'resumo' : 'painel';
      render();
    });
  });
}

function calendarioHtml(f, opts) {
  opts = opts || {};
  const [ano, mes] = st.mes.split('-').map(Number);
  const primeiro = new Date(ano, mes - 1, 1);
  const nDias = new Date(ano, mes, 0).getDate();
  const offset = primeiro.getDay(); // quantos vazios antes do dia 1
  const nomesDow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const outroMes = (delta) => {
    let a = ano, m = mes + delta;
    if (m < 1) { m = 12; a--; } if (m > 12) { m = 1; a++; }
    return a + '-' + pad(m);
  };

  let celulas = '';
  for (let i = 0; i < offset; i++) celulas += '<div class="cal-vazio"></div>';
  for (let d = 1; d <= nDias; d++) {
    const dia = `${ano}-${pad(mes)}-${pad(d)}`;
    const s = statusDoDia(f, dia);
    const sel = st.diaSel === dia ? ' sel' : '';
    const hoje = dia === hojeStr() ? ' hoje' : '';
    const marca = s.classe === 'trabalhado' ? `<span class="cal-h">${s.horas}</span>`
      : s.rotulo ? `<span class="cal-tag">${s.rotulo}</span>` : '';
    celulas += `<div class="cal-dia ${s.classe}${sel}${hoje}" onclick="selDia('${dia}')">
      <span class="cal-num">${d}</span>${marca}</div>`;
  }

  return `
<div class="cartao">
  <span class="eyebrow">Calendário <b>//</b> ${esc(f.nome)}</span>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:.4rem 0 1rem">
    <button class="secundario" style="padding:.4rem .8rem" onclick="st.mes='${outroMes(-1)}';st.diaSel=null;render()">←</button>
    <h2 style="margin:0">${st.mes.split('-').reverse().join('/')}</h2>
    <button class="secundario" style="padding:.4rem .8rem" onclick="st.mes='${outroMes(1)}';st.diaSel=null;render()">→</button>
  </div>
  <div class="cal-grade">
    ${nomesDow.map(n => `<div class="cal-dow">${n}</div>`).join('')}
    ${celulas}
  </div>
  <div class="cal-legenda">
    <span><i class="lg trabalhado"></i> Trabalhado</span>
    <span><i class="lg falta"></i> Falta</span>
    <span><i class="lg pendente"></i> Em análise</span>
    <span><i class="lg abonada"></i> Abonada</span>
  </div>
</div>
${st.diaSel ? detalheDia(f, st.diaSel, opts) : '<div class="cartao"><p class="discreto">Toque em um dia para ver as batidas.</p></div>'}
${opts.podeAprovar
  ? `<button class="secundario" onclick="st.tela='admin';render()">← Voltar</button>`
  : `<button class="secundario" onclick="trocar()">← Sair</button>`}`;
}

function detalheDia(f, dia, opts) {
  const regs = regsDo(f.id, dia);
  const s = statusDoDia(f, dia);
  const j = justPorDia(f.id, dia);
  let corpo = '';
  if (regs.length) {
    corpo = `<div class="batidas-linha">${regs.map(b => `<span class="batida-chip">${ROTULOS[b.tipo]} <span class="hora">${b.horario.slice(0,5)}</span></span>`).join('')}</div>`;
  } else {
    corpo = `<p class="discreto">Nenhuma batida neste dia.</p>`;
  }
  // justificativa existente
  let bloco = '';
  if (j) {
    const pill = j.status === 'aprovada' ? '<span class="pill ativo">abonada</span>'
      : j.status === 'recusada' ? '<span class="pill atraso">recusada</span>'
      : '<span class="pill pausa">em análise</span>';
    bloco = `<div style="margin-top:.8rem">
      <p><strong>Justificativa da falta:</strong> ${pill}</p>
      <p class="discreto" style="margin-top:.3rem">“${esc(j.texto)}”</p>
      ${opts.podeAprovar && j.status === 'pendente' ? `<div style="margin-top:.6rem;display:flex;gap:8px">
        <button style="padding:.35rem .9rem;font-size:.8rem" onclick="responderJustificativa(${j.id},'aprovar')">Aprovar</button>
        <button class="secundario" style="padding:.35rem .9rem;font-size:.8rem" onclick="responderJustificativa(${j.id},'recusar')">Recusar</button>
      </div>` : ''}
    </div>`;
  } else if (opts.podeJustificar && !regs.length && !ehFuturo(dia)) {
    // colaborador pode justificar uma falta sem ir ao escritório
    bloco = `<div style="margin-top:.9rem">
      <label>Justificar esta falta</label>
      <textarea id="just-txt" rows="2" maxlength="240" placeholder="Ex.: passei mal, tive uma emergência..."
        style="width:100%;max-width:360px;padding:.6rem .75rem;font-family:var(--body);font-size:.95rem;
        background:var(--ink2);color:var(--ivory);border:1px solid var(--line-soft);border-radius:10px;resize:vertical"></textarea>
      <div><button style="margin-top:.5rem;padding:.5rem 1.2rem" onclick="enviarJustificativa(${f.id},'${dia}')">Enviar justificativa</button></div>
    </div>`;
  }
  return `<div class="cartao">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.4rem">
      <h2 style="margin:0">${fmtData(dia)}</h2>
      <span class="pill ${s.classe==='trabalhado'?'ativo':s.classe==='falta'?'atraso':s.classe==='pendente'?'pausa':s.classe==='abonada'?'ativo':'inativo'}">${s.rotulo || s.classe}</span>
    </div>
    <div style="margin-top:.7rem">${corpo}</div>
    ${bloco}
  </div>`;
}

function enviarJustificativa(fid, dia) {

TELAS.admin = () => {
  const dia = hojeStr(), agoraS = _seg(agoraHora());
  const colaboradores = db.funcionarios.filter(f => f.papel !== 'gestor');
  const gestor = db.funcionarios.find(f => f.papel === 'gestor');
  const ativos = colaboradores.filter(f => f.ativo);

    const regs = regsDo(f.id, dia);
    let [seg, aberto] = trabalhadoDoDia(regs);
    if (aberto !== null) seg += agoraS - _seg(aberto);
    const ultimo = regs.length ? regs[regs.length-1].tipo : '';
    const [classe, rotulo] = STATUS[ultimo];
    const atrasos = atrasosDoDia(regs, f);
    const feitos = {}; regs.forEach(r => feitos[r.tipo] = r.horario.slice(0,5));
    return { f, classe, rotulo, atrasos,
      etapas: ORDEM.map(t => feitos[t] || null),
      horas: fmtSeg(seg),
      perdido: atrasos.filter(a => !a.reg.abonado).reduce((s,a) => s+a.minutos, 0) };
  });
  const atrasosHoje = hoje.flatMap(h => h.atrasos.map(a => ({ ...a, nome: h.f.nome })));

    h.classe === 'trabalhando' ? `<span class="pill ativo">${h.rotulo}</span>` :
    h.classe === 'pausa' ? `<span class="pill pausa">${h.rotulo}</span>` :

${contestacoes.length ? `<div class="cartao" style="border-color:var(--line)">

  <button onclick="cadastrar()">Cadastrar</button>
</div>
<div class="acoes">
  <button class="secundario" onclick="token=null;st.adminOk=false;st.tela=(MODO==='gestor'?'gestorLogin':'pin');recarregar().then(render)">Sair</button>
</div>`;
};

function verEspelho(fid) { st.espelhoFid = fid; st.mes = mesAtual(); st.diaSel = null; st.tela = 'adminEspelho'; render(); }
function verCalendario(fid) { st.espelhoFid = fid; st.mes = mesAtual(); st.diaSel = null; st.tela = 'adminCalendario'; render(); }
function abonar(regId) { mut('/api/admin/abonar', { reg_id: regId }); }
function salvarConfig(fid) {
  const he = document.getElementById('he-'+fid).value;
  const al = parseInt(document.getElementById('al-'+fid).value, 10);
  const ca = parseInt(document.getElementById('ca-'+fid).value, 10);
  const pin = document.getElementById('pin-'+fid).value.trim();
  if (!he || isNaN(al) || isNaN(ca)) { flash('Preencha horário e minutos válidos.', 'erro'); render(); return; }
  if (!/^\d{4,6}$/.test(pin)) { flash('O PIN deve ter de 4 a 6 dígitos.', 'erro'); render(); return; }
  mut('/api/admin/colaborador-config', { id: fid, pin, hora_entrada: he, almoco_min: al, cafe_min: ca }, 'Dados do colaborador atualizados.');
}
function salvarSenhaGestor() {
  const pin = document.getElementById('pin-gestor').value.trim();
  if (!/^\d{4,6}$/.test(pin)) { flash('O PIN deve ter de 4 a 6 dígitos.', 'erro'); render(); return; }
  mut('/api/admin/gestor-senha', { pin }, 'Sua senha de acesso foi atualizada.');
}
function criarNotificacao() {
  const fid = +document.getElementById('notif-func').value;
  const hora = document.getElementById('notif-hora').value;
  const msg = document.getElementById('notif-msg').value.trim();
  if (!fid || !hora || !msg) { flash('Escolha o colaborador, o horário e escreva a mensagem.', 'erro'); render(); return; }
  mut('/api/admin/notificacao', { funcionario_id: fid, horario: hora, mensagem: msg }, 'Notificação agendada para o app do colaborador.');
}
function removerNotificacao(id) { mut('/api/admin/notificacao-remover', { id }, 'Notificação removida.'); }
function alternar(fid) { mut('/api/admin/colaborador-alternar', { id: fid }); }
function cadastrar() {
  const nome = document.getElementById('novo-nome').value.trim();
  const pin = document.getElementById('novo-pin').value.trim();
  const he = document.getElementById('novo-he').value || '08:00';
  const al = parseInt(document.getElementById('novo-al').value, 10) || 60;
  const ca = parseInt(document.getElementById('novo-ca').value, 10) || 15;
  if (!nome || !/^\d{4,6}$/.test(pin)) { flash('Informe um nome e um PIN numérico de 4 a 6 dígitos.', 'erro'); render(); return; }
  mut('/api/admin/colaborador', { nome, pin, hora_entrada: he, almoco_min: al, cafe_min: ca }, nome + ' cadastrado(a) com sucesso.');
}

(async () => {
  try {
    if (MODO === 'gestor') { const info = await api('GET', '/api/info'); gestorNome = info.gestor_nome || 'Gestor'; st.tela = 'gestorLogin'; }
    else { const r = await api('GET', '/api/pessoas'); db.funcionarios = r.pessoas || []; st.tela = 'pin'; }
  } catch (e) {}
  render();
})();
</script>

</body>
</html>
