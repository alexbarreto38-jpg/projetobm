# Blueprint do Render para a API e os workers (+ Postgres e Redis gerenciados).
# O painel web é publicado na Vercel (ver apps/web/vercel.json e docs/deploy.md).
#
# Preencha os segredos marcados com `sync: false` no dashboard do Render.

databases:
  - name: wise-postgres
    plan: free

services:
  - type: redis
    name: wise-redis
    plan: free
    ipAllowList: [] # acesso apenas interno

  - type: web
    name: wise-api
    plan: free # instância grátis para colocar o painel no ar sem custo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Startup via script simples (scripts/start-api.sh): migra o banco e sobe a
    # API. Evita `sh -c "... && ..."` aqui porque o Render reinterpreta o comando
    # e as aspas aninhadas faziam a linha inteira virar "comando não encontrado"
    # (exit 127). O `exec` dentro do script preserva o encerramento gracioso.
    dockerCommand: sh /app/scripts/start-api.sh
    # Readiness: só considera o deploy saudável quando Postgres (e Redis) estão
    # alcançáveis. Liveness simples fica em /health.
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '3001'
      - key: DATABASE_URL
        fromDatabase:
          name: wise-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: wise-redis
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false # gere: openssl rand -base64 32
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v23.0
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_REDIRECT_URI
        sync: false

  # ── Worker de envio (DESLIGADO por enquanto) ────────────────────────────────
  # O Render não tem plano grátis para "worker" (background service). Enquanto o
  # objetivo é só colocar o PAINEL no ar sem custo, o worker fica comentado.
  # Para LIGAR o envio de campanhas em produção, descomente o bloco abaixo — ele
  # usa o menor plano pago (~US$7/mês) — e faça o redeploy do Blueprint.
  #
  # - type: worker
  #   name: wise-worker
  #   plan: starter
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: sh /app/scripts/start-worker.sh
  #   envVars:
  #     - key: NODE_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: wise-postgres
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: wise-redis
  #         property: connectionString
  #     - key: ENCRYPTION_KEY
  #       sync: false
  #     - key: META_APP_ID
  #       sync: false
  #     - key: META_APP_SECRET
  #       sync: false
  #     - key: META_GRAPH_VERSION
  #       value: v23.0
