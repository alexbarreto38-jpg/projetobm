{% extends "base.html" %}
{% block conteudo %}
<div class="cartao" style="text-align:center">
  <div class="i3d i3d--zap">
    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <span class="eyebrow">Batida confirmada <b>//</b> {{ data }}</span>
  <h1>Ponto registrado, <span class="gold">{{ nome }}</span>!</h1>
  <p class="num-grande" style="margin:.6rem 0 .2rem">{{ agora }}</p>
</div>

<div class="cartao">
  <h2>Batidas de hoje</h2>
  <table>
    <thead><tr><th>Tipo</th><th>Horário</th></tr></thead>
    <tbody>
      {% for tipo, horario in batidas %}
      <tr><td>{{ tipo }}</td><td class="hora">{{ horario }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <p style="margin-top:1rem">
    <span class="eyebrow" style="margin:0">Horas trabalhadas até agora</span><br>
    <span class="hora" style="font-size:1.3rem;font-weight:700">{{ trabalhado }}</span>
  </p>
</div>

<div style="text-align:center">
  <a href="{{ url_for('index') }}"><button class="secundario">← Voltar</button></a>
</div>
{% endblock %}
