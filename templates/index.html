{% extends "base.html" %}
{% block conteudo %}
<div class="cartao" style="text-align:center">
  <div class="i3d i3d--gold">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
  </div>
  <span class="eyebrow">Registro de ponto <b>//</b> identificação</span>
  <h1>Quem está <span class="gold">batendo</span>?</h1>
  <p class="discreto" style="margin-bottom:1.4rem">
    Digite seu PIN para abrir o seu painel de ponto do dia.
  </p>
  <form method="post" action="{{ url_for('entrar') }}">
    <input type="password" name="pin" inputmode="numeric" autocomplete="off"
           placeholder="• • • •" autofocus required
           style="max-width:230px;margin:0 auto 1.2rem;text-align:center;font-family:var(--mono);font-size:1.5rem;letter-spacing:.3em">
    <br>
    <button type="submit" style="font-size:1.05rem;padding:.95rem 2.6rem">
      Entrar
      <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>
{% endblock %}
